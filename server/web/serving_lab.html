<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Lab Serving Now</title>

<style>
  :root{
    --pak-green: #065f46;
    --accent: #16a34a;
    --card-bg: #f0fdf4;
  }

  body {
    margin: 0;
    background: #ffffff;
    font-family: "Segoe UI", Arial;
    color: #064e3b;
  }

  .container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 40px;
    gap: 22px;
  }

  .top {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .logo {
    height: 90px;
  }

  .title {
    font-size: 64px;
    font-weight: 1000;
    letter-spacing: 4px;
    color: var(--pak-green);
  }

  .card {
    margin-top: 40px;
    background: var(--card-bg);
    border: 4px solid var(--accent);
    border-radius: 28px;
    padding: 40px;
    text-align: center;
    min-width: 700px;
  }

  .counter {
    font-size: 38px;
    font-weight: 900;
  }

  .token {
    font-size: 160px;
    font-weight: 1000;
    margin-top: 10px;
  }

  .urdu {
    font-size: 26px;
    font-weight: 700;
    margin-top: 6px;
  }

  .enable-audio {
    margin-top: 20px;
    font-size: 18px;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
  .cards {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 40px;
  width: 100%;
  margin-top: 40px;
}

.card {
  flex: 1;
  max-width: 600px;
  background: var(--card-bg);
  border: 4px solid var(--accent);
  border-radius: 28px;
  padding: 40px;
  text-align: center;
}

</style>
</head>

<body>
<div class="container">
  <div class="top">
    <img src="../static/logo.png" class="logo" />
    <div class="title">LAB</div>
  </div>

<div class="cards">

  <!-- LAB CARD -->
  <div class="card">
    <div class="counter">LAB</div>
    <div class="token" id="labToken">—</div>
    <div class="urdu">لیب</div>
  </div>

  <!-- RADIOLOGY CARD -->
  <div class="card">
    <div class="counter">RADIOLOGY</div>
    <div class="token" id="radToken">—</div>
    <div class="urdu">ریڈیالوجی</div>
  </div>

</div>

<button class="enable-audio" onclick="enableAudio()">Enable Audio</button>

</div>

<!-- base audio assets -->
<audio id="ding" src="/static/ding.wav" preload="auto"></audio>
<audio id="intro" src="/static/intro.wav" preload="auto"></audio>
<audio id="lab" src="/static/lab.wav" preload="auto"></audio>

<script>
let lastLabToken = null;
let lastRadToken = null;
let audioUnlocked = false;

const LAB_COUNTER = "Lab1";
const RAD_COUNTER = "Rad1";

const DIGIT_FILE = {
  "0": "/static/0.wav",
  "1": "/static/1.wav",
  "2": "/static/2.wav",
  "3": "/static/3.wav",
  "4": "/static/4.wav",
  "5": "/static/5.wav",
  "6": "/static/6.wav",
  "7": "/static/7.wav",
  "8": "/static/8.wav",
  "9": "/static/9.wav",
};

const DIGIT_AUDIO = {};
let preloaded = false;

function enableAudio() {
  audioUnlocked = true;
  document.querySelector(".enable-audio").style.display = "none";

  if (!preloaded) {
    for (const d of Object.keys(DIGIT_FILE)) {
      const a = new Audio(DIGIT_FILE[d]);
      a.preload = "auto";
      DIGIT_AUDIO[d] = a;
    }
    preloaded = true;
  }
}

function playAudioEl(audio) {
  return new Promise(res => {
    if (!audioUnlocked) return res();
    audio.currentTime = 0;
    audio.onended = res;
    audio.onerror = res;
    audio.play().catch(() => res());
  });
}

function playDigit(d) {
  return new Promise(res => {
    if (!audioUnlocked) return res();
    const url = DIGIT_FILE[d];
    if (!url) return res();

    const a = DIGIT_AUDIO[d] || new Audio(url);
    a.currentTime = 0;
    a.onended = res;
    a.onerror = res;
    a.play().catch(() => res());
  });
}

async function speakDigits(token) {
  const s = String(token).replace(/\D/g, "");
  for (const d of s) {
    await playDigit(d);
  }
}

async function announce(token, deptAudioFile) {
  if (!audioUnlocked) return;

  await playAudioEl(document.getElementById("ding"));
  await playAudioEl(document.getElementById("intro"));
  await speakDigits(token);

  const deptAudio = new Audio(deptAudioFile);
  await playAudioEl(deptAudio);
}

async function refresh() {
  try {
    const res = await fetch(
      "/api/status?dept=welfare&stage=lab",
      { cache: "no-store" }
    );
    const data = await res.json();

    const serving = data?.serving || {};

    const labToken = serving?.[LAB_COUNTER] ?? "—";
    const radToken = serving?.[RAD_COUNTER] ?? "—";

    document.getElementById("labToken").innerText = labToken;
    document.getElementById("radToken").innerText = radToken;

    // LAB change
    if (labToken !== "—" && labToken !== lastLabToken) {
      lastLabToken = labToken;
      await announce(labToken, "/static/lab.wav");
    }

    // RADIOLOGY change
    if (radToken !== "—" && radToken !== lastRadToken) {
      lastRadToken = radToken;
      await announce(radToken, "/static/radiology.wav");
    }

  } catch (e) {
    console.error(e);
  }
}

refresh();
setInterval(refresh, 1000);
</script>


</body>
</html>
